[project]
name = "arch-legacy-wastewater-db"
version = "0.1.0"
description = "Postgres-backed wastewater facility database for Arch Legacy Partners (TX + NC v1)."
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Axiom Insights" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "exports"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

# Per-file ruff ignores. Use sparingly — each entry needs an in-line
# justification.
[tool.ruff.lint.per-file-ignores]
# The Haiku enrichment prompt is content-hashed into llm_enrichment_cache
# (see enrichment/_prompt.prompt_hash). Any textual change — including
# typographical normalization of en-dash to hyphen-minus — invalidates
# the entire v1.1.1 cache (~2,127 rows, ~$9 to re-run). The en-dashes in
# the SYSTEM_PROMPT and the MAX_TOKENS comment are intentional and stable.
"enrichment/_prompt.py" = ["RUF001"] # ambiguous EN DASH in prompt string
"enrichment/_haiku.py" = ["RUF003"]  # ambiguous EN DASH in comment

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that hit external services or a real database",
    "slow: tests that take more than a few seconds",
]
