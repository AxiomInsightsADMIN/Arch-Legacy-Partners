[project]
name = "arch-legacy-wastewater-db"
version = "0.1.0"
description = "Postgres-backed wastewater facility database for Arch Legacy Partners (TX + NC v1)."
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Axiom Insights" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "exports"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that hit external services or a real database",
    "slow: tests that take more than a few seconds",
]
