name: _nc_autonomous_fetch_probe (throwaway, no-DB)

# THROWAWAY verification of the NC autonomous edocs fetch wired in
# scrapers/state/_nc_edocs.py. Exercises the REAL scraper fetch path on the US
# runner -- discover current docid -> browser-session download -> parse -- with
# NO database and NO secrets, so it proves the fetch+parse independently of the
# full monthly_refresh (which writes to Supabase and opens a PR).
# workflow_dispatch only. DELETE after capturing the verdict.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: NC autonomous fetch + parse (no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Prove autonomous NC fetch + parse (no DB)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import io
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          import pandas as pd

          from scrapers.state import nc_deq_septage_firm as SF
          from scrapers.state import nc_deq_solid_waste as SW
          from scrapers.state._nc_edocs import fetch_report_xlsx

          print("=" * 72)
          print("SOLID WASTE")
          body, docid, url = fetch_report_xlsx("solid_waste", log=lambda m: print("  [SW]", m))
          df = pd.read_excel(
              io.BytesIO(body),
              sheet_name="Active Solid Waste Facilities",
              engine="openpyxl",
              dtype=str,
          )
          lm = SW._extract_content_date(body)
          print(f"  docid={docid} bytes={len(body):,} rows={len(df)} last_modified={lm!r}")
          print(f"  url={url}")
          print(f"  columns={list(df.columns)}")
          assert body[:4] == b"PK\x03\x04", "SW: not an XLSX"
          assert len(df) > 300, f"SW: unexpected row count {len(df)}"
          assert "Facility Id" in df.columns, "SW: missing 'Facility Id' column"
          assert lm, "SW: last_modified not extracted from About sheet"

          print("=" * 72)
          print("SEPTAGE FIRM")
          body2, docid2, url2 = fetch_report_xlsx("septage_firm", log=lambda m: print("  [SF]", m))
          xl = pd.ExcelFile(io.BytesIO(body2), engine="openpyxl")
          sheet = xl.sheet_names[0]
          df2 = pd.read_excel(io.BytesIO(body2), sheet_name=sheet, engine="openpyxl", dtype=str)
          lm2 = SF._content_date_from_sheet_name(sheet)
          print(f"  docid={docid2} bytes={len(body2):,} sheet={sheet!r} rows={len(df2)} last_modified={lm2!r}")
          print(f"  url={url2}")
          print(f"  columns={list(df2.columns)}")
          assert body2[:4] == b"PK\x03\x04", "SF: not an XLSX"
          assert len(df2) > 500, f"SF: unexpected row count {len(df2)}"
          assert "Permit" in df2.columns, "SF: missing 'Permit' column"
          assert lm2, "SF: last_modified not extracted from sheet name"

          print("=" * 72)
          print("VERDICT: AUTONOMOUS FETCH + PARSE OK (both NC rosters, no DB)")
          PY
