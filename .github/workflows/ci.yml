name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ---------------------------------------------------------------------------
  # 1) Ruff lint — fast static checks across the repo.
  # ---------------------------------------------------------------------------
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8,<1"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # 2) Pytest — unit and module-level tests. Secrets surfaced so future tests
  # that hit external services (gated behind pytest markers) have access.
  # ---------------------------------------------------------------------------
  test:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      # External-service secrets. Populated in GitHub Actions secrets; tests
      # that depend on them must skip cleanly when unset (see conftest.py).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -ra

  # ---------------------------------------------------------------------------
  # 3) Schema migration — apply both 0001_initial.sql and 0002_source_seed.sql
  # against a throwaway Postgres service container, then verify the source
  # table has exactly 12 rows (the seed cardinality locked at Checkpoint 2).
  # ---------------------------------------------------------------------------
  schema:
    name: Schema migration apply (throwaway Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_throwaway_password
          POSTGRES_DB: archlegacy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d archlegacy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_throwaway_password
      PGDATABASE: archlegacy_ci
      # External secrets referenced even though the migration job does not
      # need them — they're declared here so any future migration that
      # imports secrets (e.g. seed enrichment) has them available without a
      # workflow edit.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Confirm required extensions are available
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT name FROM pg_available_extensions WHERE name IN ('pgcrypto','citext') ORDER BY name;"

      - name: Apply 0001_initial.sql
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260511203500_initial.sql

      - name: Inspect tables created (sanity)
        run: |
          psql -v ON_ERROR_STOP=1 -c "\dt"
          psql -v ON_ERROR_STOP=1 -tA -c "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public';"

      - name: Apply 0002_source_seed.sql
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260511203501_source_seed.sql

      - name: Verify source table has exactly 12 rows
        run: |
          count=$(psql -tA -c "SELECT COUNT(*) FROM source;")
          echo "source row count: $count"
          if [ "$count" != "12" ]; then
            echo "FAIL: expected 12 source rows after seed, got $count"
            psql -c "SELECT slug, type, robots_txt_status FROM source ORDER BY id;"
            exit 1
          fi
          echo "PASS: source has 12 rows."

      - name: Verify expected slugs are all present
        run: |
          expected="epa_echo epa_cwns_2022 state_npdes tceq_central_registry tceq_public_data_lookup tceq_domestic_wastewater nc_deq_dwr nc_deq_dwm county_health_placeholder state_registries_placeholder operator_sites_placeholder discovery_crawl"
          missing=""
          for slug in $expected; do
            found=$(psql -tA -c "SELECT COUNT(*) FROM source WHERE slug='$slug';")
            if [ "$found" != "1" ]; then
              missing="$missing $slug"
            fi
          done
          if [ -n "$missing" ]; then
            echo "FAIL: missing slugs:$missing"
            exit 1
          fi
          echo "PASS: all 12 expected slugs present."

      - name: Verify tceq_central_registry is robots-disallowed
        run: |
          status=$(psql -tA -c "SELECT robots_txt_status FROM source WHERE slug='tceq_central_registry';")
          echo "tceq_central_registry.robots_txt_status = $status"
          if [ "$status" != "disallow" ]; then
            echo "FAIL: expected 'disallow', got '$status'"
            exit 1
          fi
          echo "PASS: TCEQ CRPUB robots-disallow flag persisted."

      - name: Idempotency check — re-apply seed (ON CONFLICT DO UPDATE)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260511203501_source_seed.sql
          count=$(psql -tA -c "SELECT COUNT(*) FROM source;")
          if [ "$count" != "12" ]; then
            echo "FAIL: re-apply changed row count to $count (expected 12)"
            exit 1
          fi
          echo "PASS: seed is idempotent."
