name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ---------------------------------------------------------------------------
  # 1) Ruff lint — fast static checks across the repo.
  # ---------------------------------------------------------------------------
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8,<1"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # 2) Pytest — unit and module-level tests. Secrets surfaced so future tests
  # that hit external services (gated behind pytest markers) have access.
  # ---------------------------------------------------------------------------
  test:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      # External-service secrets. Populated in GitHub Actions secrets; tests
      # that depend on them must skip cleanly when unset (see conftest.py).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -ra

  # ---------------------------------------------------------------------------
  # 3) Schema migration — apply both 0001_initial.sql and 0002_source_seed.sql
  # against a throwaway Postgres service container, then verify the source
  # table has exactly 12 rows (the seed cardinality locked at Checkpoint 2).
  # ---------------------------------------------------------------------------
  schema:
    name: Schema migration apply (throwaway Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_throwaway_password
          POSTGRES_DB: archlegacy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d archlegacy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_throwaway_password
      PGDATABASE: archlegacy_ci
      # External secrets referenced even though the migration job does not
      # need them — they're declared here so any future migration that
      # imports secrets (e.g. seed enrichment) has them available without a
      # workflow edit.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Confirm required extensions are available
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT name FROM pg_available_extensions WHERE name IN ('pgcrypto','citext') ORDER BY name;"

      # ------------------------------------------------------------------
      # Apply every migration in lexical order. The supabase CLI uses
      # YYYYMMDDHHMMSS_<name>.sql naming so lexical sort = chronological
      # order = correct dependency order. Adding a new migration to the
      # tree automatically gets it picked up by this step without an
      # edit to the workflow.
      # ------------------------------------------------------------------
      - name: Apply all supabase/migrations/*.sql in lexical order
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "FAIL: no migrations found in supabase/migrations/"
            exit 1
          fi
          # Bash glob expansion is already lexical-sorted on Linux
          for f in "${files[@]}"; do
            echo "→ applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "applied ${#files[@]} migrations"

      - name: Inspect tables created (sanity)
        run: |
          psql -v ON_ERROR_STOP=1 -c "\dt"
          psql -v ON_ERROR_STOP=1 -tA -c "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public';"

      # ------------------------------------------------------------------
      # Source-table assertions are pinned to the *exact* slug set the
      # current migrations produce. When a new source row ships, the
      # migration adds it AND this step's `expected` list is updated in
      # the same commit. The exact-match check is stricter than a
      # "13 or more" floor and surfaces unintended additions or removals
      # as a CI failure.
      # ------------------------------------------------------------------
      - name: Verify source slug set matches the expected 13
        run: |
          expected="county_health_placeholder discovery_crawl epa_cwns_2022 epa_echo nc_deq_dwm nc_deq_dwr operator_sites_placeholder state_npdes state_registries_placeholder tceq_central_registry tceq_domestic_wastewater tceq_msw_facilities_xls tceq_public_data_lookup"
          # Total count
          count=$(psql -tA -c "SELECT COUNT(*) FROM source;")
          echo "source row count: $count"
          # Actual slug set (sorted, space-separated)
          actual=$(psql -tA -c "SELECT slug FROM source ORDER BY slug;" | tr '\n' ' ' | sed 's/ $//')
          # Normalize expected to space-separated single-line for comparison
          expected_norm=$(echo "$expected" | tr -s ' ')
          actual_norm=$(echo "$actual" | tr -s ' ')
          if [ "$expected_norm" != "$actual_norm" ]; then
            echo "FAIL: slug set mismatch"
            echo "  expected: $expected_norm"
            echo "  actual  : $actual_norm"
            psql -c "SELECT slug, type, robots_txt_status FROM source ORDER BY slug;"
            exit 1
          fi
          echo "PASS: source has 13 rows with the expected slug set."

      - name: Verify tceq_central_registry is robots-disallowed
        run: |
          status=$(psql -tA -c "SELECT robots_txt_status FROM source WHERE slug='tceq_central_registry';")
          echo "tceq_central_registry.robots_txt_status = $status"
          if [ "$status" != "disallow" ]; then
            echo "FAIL: expected 'disallow', got '$status'"
            exit 1
          fi
          echo "PASS: TCEQ CRPUB robots-disallow flag persisted."

      # ------------------------------------------------------------------
      # Validate that the source_signature.last_modified column exists
      # (added by 20260511221000_add_last_modified_to_source_signature.sql).
      # Cheap insurance that schema-altering migrations actually applied.
      # ------------------------------------------------------------------
      - name: Verify source_signature.last_modified column exists
        run: |
          shape=$(psql -tA -c "SELECT is_nullable || '/' || data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='source_signature' AND column_name='last_modified';")
          echo "source_signature.last_modified shape: $shape"
          if [ "$shape" != "YES/text" ]; then
            echo "FAIL: expected 'YES/text' (nullable TEXT), got '$shape'"
            exit 1
          fi
          echo "PASS: last_modified column is nullable TEXT."

      # ------------------------------------------------------------------
      # Idempotency: re-apply every migration. Seed migrations use
      # ON CONFLICT DO UPDATE so they're safe. Schema migrations use
      # ADD COLUMN IF NOT EXISTS or otherwise no-op on second apply.
      # The CREATE EXTENSION / CREATE TABLE statements in 0001 will
      # fail on the second apply (they aren't IF NOT EXISTS for the
      # tables); we only re-apply the seed migrations to validate
      # their ON CONFLICT logic.
      # ------------------------------------------------------------------
      - name: Idempotency check — re-apply seed migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Heuristic: any file with "seed" in its basename re-applies safely
          # via ON CONFLICT. Schema-altering migrations are not re-applied.
          for f in supabase/migrations/*seed*.sql; do
            echo "→ re-applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          count=$(psql -tA -c "SELECT COUNT(*) FROM source;")
          if [ "$count" != "13" ]; then
            echo "FAIL: re-apply changed source row count to $count (expected 13)"
            exit 1
          fi
          echo "PASS: seed migrations are idempotent."
