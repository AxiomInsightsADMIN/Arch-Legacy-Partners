name: Monthly Refresh

# Monthly cron: scrape all sources, run drift detection (gates the
# canonical rebuild on no-drift), rebuild the resolver, re-export CSVs,
# push to a dated refresh branch, and open a PR back to main for audit.
# An email alert fires via ALERT_EMAIL on any step failure.
#
# Schedule: first of month at 09:00 UTC.
#   UTC 09:00 = 04:00 US/Central (CST) / 03:00 US/Central (CDT)
#   A sensible quiet hour for both client and operator.
#
# Manual trigger via workflow_dispatch is supported for ad-hoc refreshes
# and post-failure re-runs.
#
# Manual-drop caveat (NC sources): the NC DEQ DWM sources (Solid Waste,
# Septage Firm) require a manual XLSX drop into
# local/manual_drops/<source>/ because edocs.deq.nc.gov network-blocks
# Playwright. CI has no manual drops; those scrapers will fail in the
# unattended cron. Operator playbook on NC scraper failure:
#   1. Drop fresh NC XLSX locally
#   2. Run `python -m scrapers.state.nc_deq_*` on the operator machine
#      to upsert into Supabase
#   3. workflow_dispatch this workflow to re-run; the NC scrapers will
#      still fail in CI, BUT the downstream resolver + export operate on
#      whatever raw_facility_record state exists in Supabase, so the
#      manually-loaded NC data is picked up.

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write          # push refresh branch
  pull-requests: write     # open PR back to main

env:
  PYTHON_VERSION: "3.11"

jobs:

  refresh:
    name: Monthly refresh
    runs-on: ubuntu-latest
    env:
      # External-service secrets. Names match .env.example at project root.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      # SMTP credentials for the email alert step. Populate before
      # production cron use; without these, the alert step skips
      # silently and the operator must monitor GitHub Actions directly.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # need full history to branch off main

      - name: Set refresh date
        id: refresh_date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Preflight: verify required secrets"
        # Defense-in-depth: fail fast with ONE clear message when a required
        # secret is unset or empty, before any scraper runs. GitHub Actions
        # renders an unpopulated secret as an empty string, which otherwise
        # surfaces deep inside a scraper as a ValueError. SMTP_* and
        # ALERT_EMAIL are intentionally optional (the alert step soft-skips
        # when they are absent) and are NOT checked here. Only the NAMES of
        # missing variables are printed -- never any secret value.
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "SUPABASE_URL",
              "SUPABASE_DB_HOST",
              "SUPABASE_DB_PORT",
              "SUPABASE_DB_NAME",
              "SUPABASE_DB_USER",
              "SUPABASE_DB_PASSWORD",
              "SUPABASE_SERVICE_ROLE_KEY",
              "BRAVE_API_KEY",
              "ANTHROPIC_API_KEY",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print(
                  "Preflight failed: required secret(s) unset or empty: "
                  + ", ".join(missing),
                  file=sys.stderr,
              )
              print(
                  "Populate these in repository secrets (Settings -> Secrets "
                  "and variables -> Actions) before re-running this workflow.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("Preflight OK: all required secrets present.")
          PY

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # ----- Federal scrapers (no manual-drop dependency) -----
      - name: Scraper — EPA ECHO (federal)
        run: python -m scrapers.federal.epa_echo

      - name: Scraper — EPA CWNS 2022 (federal)
        run: python -m scrapers.federal.epa_cwns

      # ----- State scrapers -----
      - name: Scraper — TCEQ MSW XLS (TX)
        run: python -m scrapers.state.tceq_msw_xls

      - name: Scraper — NC DEQ Non-Discharge (NC, ArcGIS)
        run: python -m scrapers.state.nc_deq_non_discharge

      # NC SW + NC SF require manual-drop XLSX (edocs.deq.nc.gov is WAF-
      # blocked at the network layer). These two steps ALWAYS fail in CI
      # because the runner filesystem has no manual XLSX. The
      # continue-on-error toggle lets the workflow proceed past the
      # expected failures; the verification gate after step 11 then
      # confirms the operator ran these scrapers locally within the
      # last 7 days. If the gate fails, the workflow halts BEFORE the
      # resolver so stale NC data never poisons canonical_facility.
      # Operator procedure for the manual drop:
      # see docs/runbook_monthly_refresh.md section 5.
      - name: Scraper — NC DEQ Solid Waste (NC, manual-drop XLSX)
        # Expected-failure in CI; gate below confirms operator already
        # ran this locally within 7 days. See runbook §5.
        continue-on-error: true
        run: python -m scrapers.state.nc_deq_solid_waste

      - name: Scraper — NC DEQ Septage Firm (NC, manual-drop XLSX)
        # Expected-failure in CI; gate below confirms operator already
        # ran this locally within 7 days. See runbook §5.
        continue-on-error: true
        run: python -m scrapers.state.nc_deq_septage_firm

      # ----- Manual-drop freshness gate -----
      # Confirms BOTH NC manual-drop sources had a successful
      # scraper_run within the last 7 days (the operator's local-machine
      # path lands them in Supabase outside CI). If either is missing,
      # exits non-zero with a runbook-pointer error message and halts
      # the workflow before drift detection + resolver. This is the
      # contract that lets the two scraper steps soft-fail above
      # without poisoning canonical_facility with stale data.
      - name: Verify NC manual-drop data present (gate before resolver)
        run: python -m orchestration.verify_nc_manual_drop_freshness

      # ----- Drift detection -----
      # Gates the canonical rebuild. Per locked decision 8.7, any of:
      #   HTTP non-200, row count drop >30%, schema_hash mismatch,
      #   byte size delta >50%
      # → exit non-zero and write exports/drift_report.json. A
      # drift-paused source MUST NOT feed the resolver — that would
      # poison canonical_facility with a partial / corrupted snapshot.
      - name: Drift detector (orchestration/drift_detector.py)
        run: python -m orchestration.drift_detector

      # ----- Geocoder backfill -----
      # Idempotent against geocoding_cache; only new (non-cached) NC SF +
      # NC ND addresses cost Census API calls. Runs before the resolver
      # so any newly-loaded NC rows have a chance at proximity-tiebreak
      # merges in the canonical rebuild.
      - name: Geocoder backfill (NC ND + NC SF)
        run: python -m orchestration.geocoder_backfill

      # ----- Canonical rebuild -----
      - name: Resolver — full rebuild
        run: python -m resolver.entity_resolver --rebuild --force

      # ----- CSV export -----
      - name: CSV export (primary + provenance)
        run: python -m exports.export_csv

      # ----- Commit refreshed CSVs to a dated branch -----
      - name: Configure git for refresh branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push refresh branch
        id: refresh_branch
        run: |
          BRANCH="refresh/${{ steps.refresh_date.outputs.date }}"
          git checkout -b "$BRANCH"
          # CSVs are gitignored by default; force-add for the refresh branch.
          git add -f exports/facilities_primary.csv exports/facilities_provenance.csv
          if [ -f exports/drift_report.json ]; then
            git add -f exports/drift_report.json
          fi
          git commit -m "Monthly refresh ${{ steps.refresh_date.outputs.date }}

          Generated by .github/workflows/monthly_refresh.yml on the cron schedule.
          Source counts and per-source drift status are visible in
          exports/drift_report.json (committed when present). The CSVs reflect
          the canonical state after the resolver rebuild completed."
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ----- Open PR back to main for audit trail -----
      - name: Open PR back to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.refresh_branch.outputs.branch }}" \
            --title "Monthly refresh ${{ steps.refresh_date.outputs.date }}" \
            --body "$(cat <<'EOF'
          Automated monthly refresh produced by `.github/workflows/monthly_refresh.yml`.

          - Scrapers ran in order: EPA ECHO, EPA CWNS, TCEQ MSW, NC DEQ Non-Discharge, NC DEQ Solid Waste, NC DEQ Septage Firm.
          - Drift detector gated the canonical rebuild — see `exports/drift_report.json` for per-source pass/pause status.
          - Resolver re-ran with `--rebuild --force`, then the two CSVs (`facilities_primary.csv` + `facilities_provenance.csv`) were regenerated.

          Review the diff against the previous month's refresh branch to confirm: row counts, new canonicals, any flagged drift.
          EOF
          )"

      # ----- Email alert on any step failure -----
      # Fires only when a prior step failed. Includes the workflow run URL
      # so the operator can click through for the failing step name and
      # the full log without needing the log shipped inline.
      - name: Email alert on failure
        if: failure() && env.SMTP_HOST != '' && env.ALERT_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_HOST }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USER }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[Arch Legacy] Monthly refresh FAILED: ${{ steps.refresh_date.outputs.date }}"
          to: ${{ env.ALERT_EMAIL }}
          from: "Arch Legacy Refresh <${{ env.SMTP_USER }}>"
          body: |
            The monthly_refresh workflow failed on ${{ steps.refresh_date.outputs.date }}.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Click through for the failing step name and the full log. If the
            failure is in an NC scraper step (Solid Waste or Septage Firm),
            the most common cause is that no manual XLSX drop is available
            in CI — run those scrapers locally and re-trigger this workflow
            via workflow_dispatch.

      # Fallback alert when SMTP secrets are unset (early v1, before
      # Ryan ships SMTP credentials). Always emits the run URL to the
      # GitHub Actions log so the operator can spot the failure even
      # without email.
      - name: Failure summary (when SMTP unset)
        if: failure() && (env.SMTP_HOST == '' || env.ALERT_EMAIL == '')
        run: |
          echo "::error title=Monthly refresh failed::Workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "SMTP_HOST and/or ALERT_EMAIL are unset; email alert was skipped."
          echo "Configure SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD / ALERT_EMAIL"
          echo "in repository secrets to enable the email-on-failure step."
          exit 1
