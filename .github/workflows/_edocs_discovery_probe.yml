name: _edocs_discovery_probe (throwaway docid-discovery test)

# THROWAWAY docid-discovery probe (v2). Task 3 proved a US-runner browser
# session pulls the two NC XLSX by HARDCODED docid (2132701 / 2132702), but the
# file names carry a publication date so those docids rotate each period.
# v1 of this probe mapped the WasteManagement WebLink tree but its keyword BFS
# ran out of budget before reaching the files. v2 tests three discovery
# mechanisms in priority order and verifies whatever it finds:
#   D) Scrape the PUBLIC DEQ website "Solid Waste Facility Lists" page
#      (www.deq.nc.gov, reachable + robots-permissive) for the current
#      edocs `docid=` links — the page always points at the current file.
#   A) WebLink in-repo Search by document name.
#   B) Targeted crawl of the edocs "Website Files" *Webpage folders found in v1.
# Then download each discovered docid in-session and confirm PK (XLSX) magic
# and whether it still equals the known 2132701 / 2132702.
# workflow_dispatch only. No secrets, no Supabase, no data load. DELETE after
# capturing the verdict.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: edocs docid discovery probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright + chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Probe edocs/DEQ for the current docids
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          BASE = "https://edocs.deq.nc.gov/WasteManagement/"
          DEQ_PAGE = ("https://www.deq.nc.gov/about/divisions/waste-management/"
                      "solid-waste-section/"
                      "solid-waste-permitted-facility-information-and-guidance/"
                      "solid-waste-facility-lists")
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          KNOWN = {"permittedfacilitylist": "2132701", "permittedseptagefirm": "2132702"}
          TARGETS = ("permittedfacilitylist", "permittedseptagefirm")
          # v1-discovered "Website Files" *Webpage subfolder ids under Solid Waste
          # Program (253103) -> Website Files (1684702).
          WEBPAGE_FOLDERS = [
              ("Permitting Branch Webpage", "1684679"),
              ("Septage Webpage", "1684674"),
              ("SW Mgmt Plan Webpage", "1813979"),
              ("Compost Webpage", "1360741"),
              ("Facility Training Webpage", "1717916"),
              ("Compliance and Monitoring Webpage", "1684735"),
              ("Environmental Monitoring Webpage", "1257166"),
              ("Scrap Tires Webpage", "1798582"),
              ("Disaster Debris Webpage", "1684733"),
              ("Rule Readoption Webpage", "1684737"),
              ("Tax Certification Webpage", "1684734"),
              ("Staff Maps And Assignments", "1684736"),
              ("YWN Webpage", "1389116"),
          ]
          DOCID_RE = re.compile(r"[?&]docid=(\d+)", re.I)
          ID_RE = re.compile(r"[?&]id=(\d+)", re.I)

          def norm(s):
              return re.sub(r"[^a-z0-9]", "", (s or "").lower())

          def strip_tags(s):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", s or "")).strip()

          def classify(label, href=""):
              s = (label + " " + href).lower()
              if "septage" in s or "permittedseptagefirm" in norm(s):
                  return "permittedseptagefirm"
              if "permittedfacilitylist" in norm(s) or (
                  "permitted" in s and ("facilit" in s or "solid waste" in s)):
                  return "permittedfacilitylist"
              return None

          def collect_anchors(page):
              try:
                  return page.eval_on_selector_all(
                      "a",
                      "els => els.map(e => ["
                      " (e.textContent||'').replace(/\\s+/g,' ').trim().slice(0,160),"
                      " e.href||'' ])",
                  )
              except Exception as e:
                  print(f"    anchor-collect error: {type(e).__name__}: {e}")
                  return []

          def classify_anchors(anchors):
              folders, docs = [], []
              for text, href in anchors:
                  low = (href or "").lower()
                  if "browse.aspx" in low and ID_RE.search(href):
                      folders.append((text, href, ID_RE.search(href).group(1)))
                  elif "docview.aspx" in low and ID_RE.search(href):
                      docs.append((text, href, ID_RE.search(href).group(1)))
                  elif "electronicfile.aspx" in low and DOCID_RE.search(href):
                      docs.append((text, href, DOCID_RE.search(href).group(1)))
              return folders, docs

          def verify_download(context, docid):
              page = context.new_page()
              dl = None
              try:
                  url = f"{BASE}ElectronicFile.aspx?docid={docid}&dbid=0&repo=WasteManagement"
                  with page.expect_download(timeout=15000) as d:
                      try:
                          page.goto(url, wait_until="commit", timeout=30000)
                      except Exception:
                          pass
                  dl = d.value
              except PWTimeout:
                  dl = None
              if dl is None:
                  page.close()
                  return {"ok": False, "size": 0, "name": None}
              try:
                  import os
                  path = dl.path()
                  with open(path, "rb") as fh:
                      head = fh.read(8)
                  size = os.path.getsize(path) if path else 0
                  res = {"ok": head[:4] == b"PK\x03\x04" and size > 0,
                         "size": size, "name": dl.suggested_filename}
              except Exception as e:
                  res = {"ok": False, "size": 0, "name": None, "err": repr(e)}
              page.close()
              return res

          # ----- D) DEQ public website scrape -----
          def part_d(context):
              print("=" * 72)
              print(f"[D] DEQ website scrape: {DEQ_PAGE}")
              res = {}
              try:
                  r = context.request.get(DEQ_PAGE, headers={"User-Agent": UA}, timeout=45000)
                  print(f"  status={r.status} ok={r.ok}")
                  html = r.text()
              except Exception as e:
                  print(f"  DEQ fetch error: {type(e).__name__}: {e}")
                  return res
              print(f"  html_len={len(html)}")
              for m in re.finditer(r'<a\b[^>]*href="([^"]+)"[^>]*>(.*?)</a>', html, re.S | re.I):
                  href, label = m.group(1), strip_tags(m.group(2))
                  if "docid=" not in href.lower() and "edocs" not in href.lower():
                      continue
                  did = DOCID_RE.search(href)
                  did = did.group(1) if did else None
                  pref = classify(label, href)
                  print(f"  DEQ-LINK | pref={pref} docid={did} | {label[:70]!r} | {href[:110]}")
                  if did and pref and pref not in res:
                      res[pref] = {"docid": did, "label": label, "href": href, "via": "deq_website"}
              if not res:
                  for m in re.finditer(r"docid=(\d+)", html, re.I):
                      seg = html[max(0, m.start() - 90): m.end() + 10]
                      print(f"  DEQ-RAW docid={m.group(1)} ctx={strip_tags(seg)[-90:]!r}")
              return res

          # ----- A) WebLink in-repo search -----
          def part_a(context):
              print("=" * 72)
              print("[A] WebLink Search")
              res = {}
              for n, term in enumerate(["PermittedFacilityList", "PermittedSeptageFirm"]):
                  pg = context.new_page()
                  try:
                      pg.goto(f"{BASE}Search.aspx?dbid=0&repo=WasteManagement",
                              wait_until="networkidle", timeout=45000)
                      if n == 0:
                          try:
                              inv = pg.eval_on_selector_all(
                                  "input,textarea,button,select",
                                  "els=>els.map(e=>[e.tagName,e.id,e.name,e.type,"
                                  "(e.getAttribute('placeholder')||'')].join('|')).slice(0,25)")
                              print(f"  search-form controls: {inv}")
                          except Exception as e:
                              print(f"  control-dump error: {e}")
                      box = None
                      for sel in ["input[type='text']", "textarea",
                                  "input[name*='search' i]", "input[id*='search' i]"]:
                          try:
                              el = pg.query_selector(sel)
                          except Exception:
                              el = None
                          if el:
                              box = el
                              print(f"  term={term!r} using box selector {sel!r}")
                              break
                      if not box:
                          print(f"  term={term!r}: no search box found")
                          pg.close()
                          continue
                      box.fill(term)
                      box.press("Enter")
                      try:
                          pg.wait_for_load_state("networkidle", timeout=30000)
                      except Exception:
                          pass
                      print(f"  term={term!r} -> url={pg.url}")
                      _, docs = classify_anchors(collect_anchors(pg))
                      for t, h, i in docs[:25]:
                          print(f"    SR-DOC | docid/id={i} | {t!r}")
                          pref = classify(t, h)
                          if pref and pref not in res and norm(t).startswith(pref):
                              res[pref] = {"docid": i, "label": t, "href": h, "via": "search"}
                  except Exception as e:
                      print(f"  term={term!r} error: {type(e).__name__}: {e}")
                  finally:
                      pg.close()
              return res

          # ----- B) Targeted edocs folder crawl (Website Files *Webpage) -----
          def part_b(context):
              print("=" * 72)
              print("[B] Targeted Website Files *Webpage crawl")
              res = {}
              queue = [(n, fid, 1) for (n, fid) in WEBPAGE_FOLDERS]
              seen = set()
              visits = 0
              while queue and visits < 32 and not all(p in res for p in TARGETS):
                  name, fid, depth = queue.pop(0)
                  if fid in seen:
                      continue
                  seen.add(fid)
                  visits += 1
                  pg = context.new_page()
                  subf, docs = [], []
                  try:
                      pg.goto(f"{BASE}Browse.aspx?id={fid}&dbid=0&repo=WasteManagement",
                              wait_until="networkidle", timeout=45000)
                      subf, docs = classify_anchors(collect_anchors(pg))
                  except Exception as e:
                      print(f"  folder {name!r} id={fid} error: {type(e).__name__}: {e}")
                  pg.close()
                  print(f"  [B d{depth} #{visits}] {name!r} id={fid} docs={len(docs)} subf={len(subf)}")
                  for t, h, i in docs[:40]:
                      pref = classify(t, h)
                      mark = f" <== {pref}" if pref else ""
                      print(f"      DOC docid={i} | {t!r}{mark}")
                      if pref and pref not in res and norm(t).startswith(pref):
                          res[pref] = {"docid": i, "label": t, "href": h, "via": "folder", "folder": name}
                  if depth < 2:
                      for t, h, i in subf:
                          if i not in seen:
                              queue.append((f"{name}/{t}", i, depth + 1))
              return res

          def main():
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(accept_downloads=True, user_agent=UA)

                  print(f"[LAND] {BASE}")
                  lp = context.new_page()
                  try:
                      resp = lp.goto(BASE, wait_until="networkidle", timeout=45000)
                      print(f"  status={resp.status if resp else None} cookies={len(context.cookies())}")
                  except Exception as e:
                      print(f"  LAND error: {type(e).__name__}: {e}")
                  lp.close()

                  d_res = part_d(context)
                  a_res = part_a(context)
                  b_res = part_b(context)

                  merged = {}
                  for src in (d_res, a_res, b_res):  # priority D > A > B
                      for pref, info in src.items():
                          merged.setdefault(pref, info)

                  print("=" * 72)
                  print("VERIFY DOWNLOADS (merged best docids)")
                  for pref in TARGETS:
                      if pref in merged:
                          did = merged[pref]["docid"]
                          v = verify_download(context, did)
                          merged[pref]["fetch_ok"] = v["ok"]
                          merged[pref]["fetch_size"] = v["size"]
                          merged[pref]["fetch_name"] = v.get("name")
                          print(f"  {pref}: docid={did} via={merged[pref]['via']} "
                                f"fetch_ok={v['ok']} size={v['size']} name={v.get('name')!r}")

                  context.close()
                  browser.close()

              print("=" * 72)
              print("==== DISCOVERY SUMMARY ====")
              print(f"  mechanism D (deq_website) found: "
                    f"{ {k: v['docid'] for k, v in d_res.items()} }")
              print(f"  mechanism A (search)      found: "
                    f"{ {k: v['docid'] for k, v in a_res.items()} }")
              print(f"  mechanism B (folder)      found: "
                    f"{ {k: v['docid'] for k, v in b_res.items()} }")
              all_ok = True
              for pref in TARGETS:
                  if pref in merged:
                      m = merged[pref]
                      km = (m["docid"] == KNOWN[pref])
                      extra = f" folder={m.get('folder')!r}" if m.get("folder") else ""
                      print(f"  {pref}: docid={m['docid']} via={m['via']}{extra} "
                            f"matches_known_{KNOWN[pref]}={km} "
                            f"fetch_ok={m.get('fetch_ok')} size={m.get('fetch_size')} "
                            f"name={m.get('fetch_name')!r}")
                      print(f"      href: {m['href']}")
                      all_ok = all_ok and bool(m.get("fetch_ok"))
                  else:
                      print(f"  {pref}: NOT DISCOVERED by any mechanism")
                      all_ok = False
              print("VERDICT:", "DISCOVERY VIABLE — both docids found & fetchable"
                    if all_ok else "NEEDS REVIEW — see dumps above")

          main()
          PY
