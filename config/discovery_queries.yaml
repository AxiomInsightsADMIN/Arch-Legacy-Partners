# =============================================================================
# discovery_queries.yaml
# Arch Legacy Partners — Wastewater Facility Database
# Phase 4.5 discovery crawl: bounded query template library.
#
# Each category in this file enumerates Brave Search query templates that
# target a specific gap category from docs/v1_scope_limitations.md. The
# Phase 4.5 harvester (scrapers/discovery/discovery_crawl.py) walks every
# (category, state, template) tuple, runs the Brave query, harvests the
# top N URLs into the discovered_url table, dedupes by URL hash, and
# stops when the per-phase Brave budget cap is hit.
#
# Template syntax:
#   {state}      — full state name (e.g. "Texas", "North Carolina").
#                  Resolved from target_states per category at harvest time.
#
# Budget math:
#   Each template × each entry in target_states = 1 Brave query.
#   At Brave Data for Search paid pricing (~$0.005 / query) and ~140
#   templates across 4 categories with single- or dual-state targets,
#   the harvest phase budget projects to well under the $5 cap. See
#   docs/build_log.md 2026-05-14 Phase 4 close entry for the cost frame.
#
# Acceptance-flag enrichment for discovered facilities is OUT of Phase 4.5
# scope. Discovery surfaces the facility; acceptance posture is run in
# the monthly refresh after the canonical is approved into v_all_in_scope.
#
# Edit rules:
# - Templates should be diverse (regional, business-style, regulatory)
#   to maximize unique URL surface; near-duplicates waste Brave budget.
# - Templates that hard-code a state name (e.g. "Texas") are allowed
#   when the category's target_states is a single state; the {state}
#   parameter is then redundant but kept for harvester uniformity.
# - When a category has multiple target_states, use {state} consistently
#   so the harvester can expand across all targets without per-state
#   duplication in this file.
# =============================================================================

version: "0.1.0"
last_updated: "2026-05-14"
authored_by: "Axiom Insights"

# State-name lookup used by the harvester. {state} placeholder in
# templates is resolved through this table at harvest time.
states:
  TX: "Texas"
  NC: "North Carolina"

categories:

  # ---------------------------------------------------------------------------
  county_manhole_program:
    description: >-
      County- or municipal-level publicly accessible disposal programs that
      let licensed septage haulers discharge into a fixed receiving point
      (manhole, POTW septage station, municipal sanitation dump site).
      Gap category — 0 canonical rows in v1 because these programs are
      not in any state registry; they live on county environmental-health
      and city public-works pages.
    target_states: [TX, NC]
    templates:
      - "{state} county manhole disposal program"
      - "{state} septage hauler manhole dumping"
      - "{state} POTW receiving station hauler"
      - "{state} septic pumper authorized discharge site"
      - "{state} wastewater treatment plant septage receiving"
      - "{state} county septage drop off"
